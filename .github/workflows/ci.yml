name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2 and no flock(1). That is the point of running it
      # here: orch's portability rules exist for this runner, and the O_EXCL
      # lock fallback is only exercised on it.
      - name: environment
        run: |
          bash --version | head -1
          jq --version
          git --version
          command -v flock || echo "flock absent (expected on macOS)"

      - name: syntax
        run: |
          set -e
          for f in bin/orch lib/*.sh lib/substrate/*.sh lib/launcher/*.sh \
                   hooks/*.sh test/*.sh install.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done

      - name: no bashisms above bash 3.2
        run: |
          # Associative arrays, mapfile/readarray, and ${var,,} are 4.0+ and
          # macOS will never have them. Catch them here rather than on someone's
          # laptop.
          # Comment lines are excluded: the portability rules are written down
          # in lib/common.sh's header, and naming a construct is not using it.
          hits="$(grep -nE 'declare -A|readarray|mapfile|\$\{[A-Za-z_]+,,\}|\$\{[A-Za-z_]+\^\^\}' \
                    bin/orch lib/*.sh lib/substrate/*.sh lib/launcher/*.sh hooks/*.sh 2>/dev/null \
                  | grep -vE ':[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits" >&2
            echo "bash 4+ construct found" >&2
            exit 1
          fi

      - name: settings are valid JSON
        run: |
          set -e
          jq -e . settings.json > /dev/null
          for f in settings/*.json; do jq -e . "$f" > /dev/null; done

      - name: test suite
        run: bash test/run-all.sh
